{# The Layers plate — five rings, a sweep, the real shield in the center #}
<div class="plate" aria-label="The five layers of protection: Deter, Detect, Delay, Respond, Recover" role="img">
  <svg viewBox="0 0 500 500">
    <defs>
      <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2a37" stop-opacity="0"/><stop offset="1" stop-color="#ff2a37" stop-opacity=".35"/></linearGradient>
      <clipPath id="pc"><circle cx="250" cy="250" r="238"/></clipPath>
    </defs>
    <g clip-path="url(#pc)"><path class="sweep" d="M250 250 L250 12 A238 238 0 0 1 418 82 Z"/></g>
    <line class="cross" x1="250" y1="6" x2="250" y2="494"/><line class="cross" x1="6" y1="250" x2="494" y2="250"/>
    {% for L in layers %}{% set r = 238 - loop.index0*36 %}
    <circle class="r" cx="250" cy="250" r="{{ r }}" data-layer="{{ L.id }}"/>
    <circle class="hit" cx="250" cy="250" r="{{ r }}" fill="none" stroke="transparent" stroke-width="40" style="cursor:pointer;pointer-events:stroke"/>
    <text class="lbl" x="250" y="{{ 250 - r + 14 }}" text-anchor="middle">{{ L.n }} {{ L.name }}</text>
    {% endfor %}
    <circle class="blip" cx="330" cy="150" r="5"/><circle class="blip" cx="160" cy="320" r="4" style="animation-delay:3.4s"/>
    <circle cx="250" cy="250" r="52" fill="#000" stroke="#2f2f36"/>
  </svg>
  <img src="{{ root }}assets/logo-shield.png" alt="">
</div>
